- institution: University of Copenhagen
  url: https://www.ku.dk/en
  degree: Master
  area: "Nanoscience — Neutron & X-ray Science"
  score: "Grade 12 (A) for 60 ECTS Master's Thesis"
  startDate: Sep 1, 2024
  endDate: Jul 1, 2026
  courses:
    - "Experimental X-ray Physics"
    - "Neutron Scattering"
    - "Applications of X-ray and Neutron Scattering in Biology, Chemistry and Physics"
    - "Applied Machine Learning"
    - "Quantum Nanoelectronics"
    - "Computational Chemistry"
  summary: |
    - **Thesis Research (60 ECTS, Grade: 12)**: Investigated neutron moderator materials using computational modelling and analysis of neutron transmission & inelastic neutron scattering data (Supervisors: Assoc. Prof. Dr. Heloisa Bordallo, NBI, & Dr. Svemir Rudić, ISIS).
    - **Large-Scale Facility Experience**: Participated in six beamtimes, at the ISIS Neutron and Muon Source (TOSCA, POLARIS), MAX IV Laboratory (CoSAXS), Paul Scherrer Institut (CAMEA), and Diamond Light Source (VerSoX).
    - **Advanced Coursework & Training**: Completed specialised modules in X-ray and neutron science (22.5 ECTS) and computational methods (22.5 ECTS), supplemented by extracurricular participation in the 2025 NNSP-SwedNess Neutron Summer School (4 ECTS) and the 2025 Theory Meets XFELs workshop.
    - **Student Advocacy**: Engaged in student politics, volunteer leadership, and organizational activities as a board member of IDA STEM Students. Worked with policy of research, innovation, and higher education, holding various positons of trust.

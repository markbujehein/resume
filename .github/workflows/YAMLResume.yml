name: Build Resume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # - name: Resolve !include tags
      #   run: |
      #     # Use yq to find any nodes with the !include tag and substitute them with the external file
      #     yq eval '
      #       .. | select(tag == "!include") |= load(.)
      #     ' resume-en.source.yml > resume-en.yml

      - name: Build resumes
        id: build
        uses: yamlresume/action@v0.2.2
        with:
          resumes: |
            resume-en.yml
          verbose: true

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: |
            *.pdf
            *.tex

name: Build Resume

on:
  push:
    branches: [main]
    # paths:
    #   - 'resume-en.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      # - name: Resolve !include tags
      #   run: |
      #     # Use yq to find any nodes with the !include tag and substitute them with the external file
      #     yq eval '
      #       .. | select(tag == "!include") |= load(.)
      #     ' resume-en.source.yml > resume-en.yml
      
      - name: Build resumes
        id: build
        uses: yamlresume/action@v0.2.2
        with:
          resumes: |
            resume-en.yml
          verbose: true

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resumes
          path: |
            *.pdf
            *.tex
          retention-days: 7   # Automatically deletes old artifacts to save storage space

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      
    steps:
      - name: Download compiled resumes
        uses: actions/download-artifact@v8
        with:
          name: resumes

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the execution run number as a unique, non-colliding tag identifier
          TAG_NAME="v${{ github.run_number }}"
          
          gh release create "$TAG_NAME" \
            --title "Resume Version $TAG_NAME" \
            --notes "Automated compiled production artifacts generated from commit ${{ github.sha }}." \
            *.pdf *.tex

name: Build Resume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build resumes
        id: build
        uses: yamlresume/action@main
        with:
          resumes: |
            resume-en.yml
          verbose: false

      # The following steps will only execute on the main branch
      - name: Get current date for tag
        if: github.ref == 'refs/heads/main'
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: resume-${{ steps.date.outputs.date }}
          name: Resume Build ${{ steps.date.outputs.date }}
          body: |
            Automated production artifacts generated from commit ${{ github.sha }}.
          files: |
            *.pdf
            *.tex
          draft: true
          prerelease: true


name: Build Resume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build resumes
        id: build
        uses: yamlresume/action@main
        with:
          resumes: |
            resume-en.yml
          verbose: false

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: Resume Build v${{ github.run_number }}
          files: |
            *.pdf
            *.tex
          draft: false
          prerelease: false

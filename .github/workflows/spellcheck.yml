name: Spellcheck

on:
  push:
    branches: [main]
    paths:
      - '**/*.yml'
    paths-ignore:
      - '.github/**/*.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.yml'
    paths-ignore:
      - '.github/**/*.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Spellcheck
        uses: igsekor/pyspelling-any@v1

            - **Thesis Research (60 ECTS, Grade: 12)**: Investigated candidate neutron moderator materials using computational modelling and analysis of neutron transmission & inelastic neutron scattering data from VESUVIO and TOSCA (Supervisors: Heloisa Bordallo, NBI, & Svemir Rudić, ISIS). Was taught data reduction and data analysis of QENS, Neutron Compton Scattering, and Neutron Diffraction.
            - **Large-Scale Facility Experience**: Participated in six beamtimes, at the ISIS Neutron and Muon Source (TOSCA, POLARIS), MAX IV (CoSAXS), Paul Scherrer Institute (CAMEA), and Diamond Light Source (VerSoX).
            - **Advanced Coursework & Training**: Completed specialised modules in X-ray and neutron science (22.5 ECTS) and computational methods (22.5 ECTS), supplemented by extracurricular participation in the 2025 NNSP-SwedNess Neutron Summer School (4 ECTS) and the 2025 Theory Meets XFELs workshop.

        summary: |
            - **MSc Research:** Thesis on neutron moderator evaluation combining computational methods as well as analysis of experimental neutron transmission and inelastic neutron scattering data.
            - **Beamline Experience:** Hands‑on beamtimes at ISIS, MAX IV, PSI and Diamond (TOSCA, CoSAXS, CAMEA, VerSoX); sample prep, cryogen handling, gas loading equipment, and data collection.
            - **Nanoscience:** Broad experimental, computational, and analytic experience across physics, materials engineering, and bioengineering.
            - **Statistics & ML:** Python-based data analysis, applied statistics & ML, and Monte‑Carlo simulation (incl. McStas, NCrystal); implemented GNN for anylysis of data from test beamline being developed for CERN.
            
